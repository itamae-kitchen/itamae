name: test_main

on:
  workflow_call:
    inputs:
      ruby:
        required: true
        type: string
      rubyopt:
        required: false
        type: string
        default: ""
    secrets:
      SLACK_WEBHOOK:
        required: true

jobs:
  unit:
    runs-on: ${{ case(inputs.ruby < '3.2', 'ubuntu-24.04', 'ubuntu-latest') }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1.326.0
        with:
          ruby-version: ${{ inputs.ruby }}
          bundler-cache: true
          bundler: default

      - run: bundle update

      - run: bundle exec rake spec:unit
        env:
          RUBYOPT: ${{ inputs.rubyopt }}

      - name: Slack Notification (not success)
        uses: act10ns/slack@v2.2.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          inputs: ${{ toJson(inputs) }}

  integration-docker:
    runs-on: ${{ case(inputs.ruby < '3.2', 'ubuntu-24.04', 'ubuntu-latest') }}

    strategy:
      fail-fast: false

      matrix:
        image:
          - ubuntu:trusty

    env:
      TEST_IMAGE: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Pull Docker Hub images through mirror.gcr.io
        run: |
          sudo cp .github/workflows/docker-daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker

      - uses: ruby/setup-ruby@v1.326.0
        with:
          ruby-version: ${{ inputs.ruby }}
          bundler-cache: true
          bundler: default

      - run: bundle update

      - run: bundle exec rake spec:integration:docker:httpbin_start
        env:
          RUBYOPT: ${{ inputs.rubyopt }}

      - run: bundle exec rake spec:integration:docker:boot
        env:
          RUBYOPT: ${{ inputs.rubyopt }}

      - run: bundle exec rake spec:integration:docker:provision
        env:
          RUBYOPT: ${{ inputs.rubyopt }}

          # FIXME: avoid error for "Command `chmod 777 /tmp/itamae_tmp` failed. (exit status: 1)"
          ITAMAE_TMP_DIR: /var/tmp/itamae_tmp

      - run: bundle exec rake spec:integration:docker:serverspec
        env:
          RUBYOPT: ${{ inputs.rubyopt }}

      - run: bundle exec rake spec:integration:docker:clean_docker_container
        env:
          RUBYOPT: ${{ inputs.rubyopt }}

      - run: bundle exec rake spec:integration:docker:httpbin_stop
        if: always()
        env:
          RUBYOPT: ${{ inputs.rubyopt }}

      - name: Slack Notification (not success)
        uses: act10ns/slack@v2.2.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          matrix: ${{ toJson(matrix) }}

  integration-local:
    runs-on: ${{ case(inputs.ruby < '3.2', 'ubuntu-24.04', 'ubuntu-latest') }}

    # NOTE: When ruby is 3.0, tests run on bullseye. But bullseye is already EOL and didn't work apt-get
    if: ${{ inputs.ruby >= '3.1' }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Pull Docker Hub images through mirror.gcr.io
        run: |
          sudo cp .github/workflows/docker-daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker

      - uses: ruby/setup-ruby@v1.326.0
        with:
          ruby-version: ${{ inputs.ruby }}
          bundler-cache: true
          bundler: default

      - run: bundle update

      - run: bundle exec rake spec:integration:local:main
        env:
          RUBYOPT: ${{ inputs.rubyopt }}

      - run: bundle exec rake spec:integration:local:ordinary_user
        env:
          RUBYOPT: ${{ inputs.rubyopt }}

      - name: Slack Notification (not success)
        uses: act10ns/slack@v2.2.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          inputs: ${{ toJson(inputs) }}
